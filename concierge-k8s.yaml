juju:
  model-defaults:
    logging-config: <root>=INFO; unit=DEBUG
providers:
  k8s:
    enable: true
    bootstrap: true
    channel: 1.32-classic/stable
    bootstrap-constraints:
      root-disk: 5G
host:
  snaps:
    jhack:
      channel: latest/edge
      connections:
        - jhack:dot-local-share-juju snapd
    # S3-compatible backend for the backup integration tests.
    microceph:
      channel: squid/stable
    # Runtime for Azurite, the Azure Blob emulator the backup tests install
    # from npm. Here rather than in the fixture so the download lands in
    # `concierge prepare`, not in the job's test budget.
    node:
      channel: 22/stable
